name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # Upgraded to specific non-deprecated version

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4  # Upgraded version

      - name: Set up Java
        uses: actions/setup-java@v5  # Upgraded version
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build  # Replace with your actual build command

      # Add a step here to upload the APK as an artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
